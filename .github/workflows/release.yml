name: Release DEAS

# Tag `vX.Y.Z` (matching package.json / tauri.conf.json) → GitHub Release with the
# Linux binary and the Windows exe + NSIS installer. Tests run in verify.yml on the same commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Ubuntu: the Linux binary then runs on glibc >= 2.35 distributions.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release
      - name: Stage Linux binary
        if: runner.os == 'Linux'
        run: mkdir -p dist && cp src-tauri/target/release/deas dist/deas-linux-amd64
      - name: Windows installer bundle
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis && mkdir dist && copy src-tauri\target\release\deas.exe dist\ && copy src-tauri\target\release\bundle\nsis\*.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: deas-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
