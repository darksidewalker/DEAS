name: Verify DEAS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux webview build prerequisites
        if: runner.os == 'Linux'
        # Folder guards reject shared-writable /tmp, so tests need a private TMPDIR.
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          mkdir -m 700 "$HOME/deas-tmp" && echo "TMPDIR=$HOME/deas-tmp" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Frontend typecheck and tests on Windows
        if: runner.os == 'Windows'
        run: npm run typecheck && npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Diagnose Linux readiness deadline timing
        id: readiness_diagnostic
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked stalled_owned_http_respects_overall_readiness_deadline -- --nocapture --test-threads=1
      - name: Native tests (normal parallel execution)
        if: ${{ !cancelled() && (success() || steps.readiness_diagnostic.outcome == 'failure') }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release
      # Compiles and links the real Windows binary and NSIS installer; CI does not
      # run it, so this is build evidence, not Windows runtime acceptance.
      - name: Windows installer bundle
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: deas-windows-x86_64
          path: |
            src-tauri/target/release/deas.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
