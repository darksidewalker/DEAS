[package]
name = "deas"
version = "0.1.53"
license = "GPL-3.0-or-later"
description = "DEAS — Dark Engine AI Studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process", "sync"] }
sha2 = "0.10"
png = "=0.17.16"
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "load-dynamic", "half", "cuda", "api-29"] }
half = { version = "=2.7.1", optional = true, default-features = false, features = ["std"] }
toml = "0.8"
flate2 = "1"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1", features = ["v4"] }
dunce = "1"
rfd = "0.17.2"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false }
base64 = "0.22"
tempfile = "3"
# Prompt Forge reads PromptForge's tag and character databases as they are.
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
# Decodes the compressed bundled payload; the exporter compresses it with the zstd CLI.
ruzstd = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
video-upscale = ["dep:ort", "dep:half"]

[[example]]
name = "upscale_png"
required-features = ["video-upscale"]

[[example]]
name = "upscale_video"
required-features = ["video-upscale"]

[profile.release]
strip = true
lto = true
codegen-units = 1
