[package]
name = "deas"
version = "0.3.26"
license = "GPL-3.0-or-later"
description = "DEAS — Dark Engine AI Studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process", "sync"] }
# Agent API (/v1 plane) transport: axum router + serve over tokio; hyper/tower stay transitive.
axum = "0.8"
sha2 = "0.10"
png = "=0.17.16"
image-webp = "=0.2.4"
toml = "0.8"
flate2 = "1"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1", features = ["v4"] }
dunce = "1"
rfd = "0.17.2"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false }
base64 = "0.22"
tempfile = "3"
# Prompt Forge reads PromptForge's tag and character databases as they are.
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
# Decodes the compressed bundled payload; the exporter compresses it with the zstd CLI.
ruzstd = "0.8"
# Decodes retained YuE2 FLAC results before caching/exporting them (pure Rust, bounded).
claxon = "0.4"
spellbook = "0.4"

[dev-dependencies]
# Service::call on the axum Router in agent_api unit tests.
tower-service = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_UI_Shell_Common"] }


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Debug/test artifacts dominate the build cache; line tables keep panic backtraces
# readable while dropping the per-variable debuginfo that doubles artifact sizes.
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Model hashing is measured against the installed library, where a debug build runs SHA-256 roughly 30x
# slower than release (75 vs 2,254 MiB/s here) and turns a throughput bug into a build artefact. Only the
# hashing crates get optimized; nothing else in a dev build changes, and release is already optimized.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3
