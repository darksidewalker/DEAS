# Strict data-only v1 catalog. No browse/download happens while reading this file.
# Extend at runtime with native_download_import_catalog({text}) containing a v1
# catalog with new providers/entries; duplicate IDs fail closed, never override.
# HTTP index: index:https://... serves {version:1, resources:[Resource IPC schema]}.
# direct:https://... treats any URL (including workflow JSON) as a direct file.
# Without a prefix, .json is an index and other HTTPS URLs are direct files.
# Query credentials/hooks are not accepted; only safe CivitAI file selectors.
# Entry-only imports use providers=[] and may reference existing provider IDs.
