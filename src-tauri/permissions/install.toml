[[permission]]
identifier = "allow-native-install"
description = "Plan a new isolated environment or preview/open a checked existing DEAS environment; upgrade or reinstall the open owned environment (all of ComfyUI or only PyTorch), with a read-only PyTorch update check; cancel only the app-owned installer worker; move the open environment to a new folder while its backend is stopped."
commands.allow = ["native_install_defaults", "native_install_plan", "native_install_start", "native_install_open", "native_install_status", "native_install_cancel", "native_install_update", "native_torch_update_check", "native_environment_move"]
