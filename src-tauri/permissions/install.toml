[[permission]]
identifier = "allow-native-install"
description = "Plan a new isolated environment or preview/open a checked existing DEAS environment; upgrade or reinstall the open owned environment; cancel only the app-owned installer worker."
commands.allow = ["native_install_defaults", "native_install_plan", "native_install_start", "native_install_open", "native_install_status", "native_install_cancel", "native_install_update"]
