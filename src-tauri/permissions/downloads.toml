[[permission]]
identifier = "allow-download-plugins"
description = "Explicit data-only catalogs, provider browsing and confirmed staged downloads in the local main webview."
commands.allow = ["native_download_catalog", "native_download_import_catalog", "native_download_browse", "native_download_plan", "native_download_start", "native_download_status", "native_download_cancel", "native_models_scan", "native_model_info", "native_model_family_write", "native_model_scan_start", "native_model_scan_status"]

[[permission]]
identifier = "allow-auth-plugins"
description = "Explicit native origin-bound credential changes, metadata inspection and vault restoration."
commands.allow = ["native_auth_verify", "native_auth_status", "native_auth_set", "native_auth_remove", "native_auth_restore"]
