[[permission]]
identifier = "allow-native-spellcheck"
description = "In-app prompt spellcheck: read dictionary status, check words and fetch suggestions against the installed pinned Hunspell pair; no prompt text leaves the machine."
commands.allow = ["native_spellcheck_status", "native_spellcheck_check", "native_spellcheck_suggest"]

[[permission]]
identifier = "allow-native-spellcheck-dictionary-install"
description = "Download and install the pinned Hunspell dictionary pair for one spellcheck language into the DEAS data folder; digest- and size-checked, no credentials."
commands.allow = ["native_spellcheck_install"]
