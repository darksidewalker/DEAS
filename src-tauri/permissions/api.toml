[[permission]]
identifier = "allow-native-negotiate-api"
description = "Bounded read-only API negotiation against an explicitly selected HTTP endpoint; no generation, assets or service lifecycle."
commands.allow = ["native_negotiate_api"]

[[permission]]
identifier = "allow-native-recipe-prerequisites"
description = "Bounded read-only core object_info diagnostic recipe prerequisites at an explicitly selected endpoint; no submission, assets, or service lifecycle."
commands.allow = ["native_recipe_prerequisites"]

[[permission]]
identifier = "allow-native-diagnostic-jobs"
description = "Prepare a bounded diagnostic image intent, explicitly submit its immutable plan, and inspect only its correlated job; job-bound PNG retrieval and explicit new-file export only; inpaint mask PNG upload under a fresh name in the backend input folder's deas-masks; explicit native-chooser video upload under a fresh backend input name and bounded hash/probe preparation of input-relative H3 videos (no inference); no arbitrary graphs/paths or global interrupts; explicit confirmed deletion of exactly one correlated pending native-held Workbench prompt on the owned loopback backend only; explicit confirmed per-job running interruption through the authenticated source-pinned owned adapter, never core global interrupt; confirmed whole-Workbench Stop coordinates those targeted paths and discards unsent preparations, without service stop or foreign jobs."
commands.allow = ["native_workbench_stop", "native_workbench_interrupt_running", "native_workbench_cancel_pending", "native_workbench_run", "native_workbench_current", "native_workbench_poll", "native_job_current", "native_job_output", "native_job_export", "native_job_prepare", "native_job_submit", "native_job_status", "native_mask_upload", "native_input_upload", "native_h3_session", "native_h3_refmods", "native_h3_video_prepare", "native_h3_video_upload"]

[[permission]]
identifier = "allow-native-jobs-history"
description = "Read bounded local recent generation metadata without backend requests, file grants, cancellation or submission authority."
commands.allow = ["native_jobs_history", "native_jobs_history_outputs", "native_logs_history_error"]
